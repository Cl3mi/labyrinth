spring.application.name=Labyrinth.Server

server.name=Group 1
server.port=8082
server.publichost=localhost
management.api.url=https://mgmt.dvl.spalx.dev

# --- Persistence (game records and results) ---
# Default: in-memory H2 in PostgreSQL mode, data is lost on restart (same as before).
# Production: set SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/labyrinth,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD in the environment.
spring.datasource.url=jdbc:h2:mem:labyrinth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.flyway.locations=classpath:db/migration
# Identifies this server process in the database. Empty = <hostname>:<server.port>.
labyrinth.instance-id=
